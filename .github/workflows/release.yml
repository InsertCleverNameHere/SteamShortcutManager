name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build-windows:
    name: Build Windows Executable
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/runtime.txt pyinstaller

      - name: Build Windows .exe
        run: pyinstaller build.spec

      - name: Run Windows Smoke Test
        run: .\dist\SteamShortcutManager.exe --smoke-test

      - name: Upload Windows binary artifact
        uses: actions/upload-artifact@v7
        with:
          name: windows-artifact
          path: dist/SteamShortcutManager.exe
          retention-days: 1

  build-linux:
    name: Build Linux AppImage
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Linux build libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon0 libxcb-cursor0 libdbus-1-3 libfontconfig1 xvfb

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/runtime.txt pyinstaller

      - name: Build AppImage
        run: ./packaging/linux/build_appimage.sh

      - name: Run AppImage Smoke Test
        run: QT_QPA_PLATFORM=offscreen xvfb-run ./dist/SteamShortcutManager-x86_64.AppImage --smoke-test

      - name: Upload Linux AppImage artifact
        uses: actions/upload-artifact@v7
        with:
          name: linux-artifact
          path: dist/SteamShortcutManager-x86_64.AppImage
          retention-days: 1

  publish-release:
    name: Publish Release & Attest Provenance
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Generate SHA256SUMS
        run: |
          cd dist
          sha256sum SteamShortcutManager.exe SteamShortcutManager-x86_64.AppImage > SHA256SUMS
          cat SHA256SUMS

      - name: Attest Build Provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/SteamShortcutManager.exe
            dist/SteamShortcutManager-x86_64.AppImage
            dist/SHA256SUMS

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/SteamShortcutManager.exe
            dist/SteamShortcutManager-x86_64.AppImage
            dist/SHA256SUMS
          generate_release_notes: true