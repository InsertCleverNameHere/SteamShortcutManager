[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "steam-shortcut-manager"
version = "0.3.2"
description = "Manage Steam non-Steam game shortcuts and inject official grid artwork."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "InsertCleverNameHere" }
]
dependencies = [
    "PySide6>=6.5.0",
    "vdf>=3.4",
    "requests>=2.28.0",
    "steam>=1.4.4",
    "eventemitter>=0.2.0",
    "gevent>=22.10.0",
    "gevent-eventemitter>=2.1",
    "protobuf>=3.20.3",
    "pycryptodomex>=3.18.0",
    "pefile>=2023.2.7",
    "LnkParse3>=1.4.0",
    "psutil>=5.9.0",
    "pywin32>=306; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-qt>=4.2.0",
    "pytest-cov>=4.0.0",
    "requests-mock>=1.10.0",
    "hypothesis>=6.70.0",
    "ruff>=0.1.0",
    "black>=23.0.0",
    "pyright>=1.1.300",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "ui*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes (undefined names, missing imports)
    "W",   # pycodestyle warnings
    "I",   # isort (import sorting)
    "UP",  # pyupgrade (modern Python syntax)
]
ignore = [
    "E501",  # line length (handled by Black)
]
unfixable = [
    "F401",  # NEVER automatically delete imports
]

[tool.ruff.lint.per-file-ignores]
"main.py" = ["E402"]

[tool.black]
line-length = 88
target-version = ["py311"]